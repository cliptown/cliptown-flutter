<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a1490"/>
      <stop offset="1" stop-color="#1c0638"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5fb4"/>
      <stop offset="1" stop-color="#ff2e97"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#ff2e97" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff2e97" stop-opacity="0"/>
    </radialGradient>
    <filter id="lit" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px rounded square centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <!-- rounded play triangle -->
  <path d="M330 290 C330 252 368 232 401 252 L734 455 C768 476 768 548 734 569 L401 772 C368 792 330 772 330 734 Z"
        fill="none" stroke="url(#ring)" stroke-width="44" stroke-linejoin="round"/>
  <!-- skyline -->
  <g>
    <path d="M384 662 V560 L432 516 L480 560 V662 Z" fill="#ff2e97"/>
    <path d="M492 662 V430 L540 384 L588 430 V662 Z" fill="#4db0ff"/>
    <path d="M600 662 V500 H668 V662 Z" fill="#ffc21f"/>
    <rect x="626" y="440" width="7" height="60" fill="#ffc21f"/>
    <path d="M633 440 L668 456 L633 472 Z" fill="#ffc21f"/>
    <!-- windows -->
    <g fill="#2a0a52">
      <rect x="405" y="582" width="16" height="16"/><rect x="439" y="582" width="16" height="16"/>
      <rect x="512" y="452" width="18" height="18"/><rect x="548" y="452" width="18" height="18"/>
      <rect x="512" y="494" width="18" height="18"/><rect x="548" y="494" width="18" height="18"/>
      <rect x="512" y="536" width="18" height="18"/><rect x="548" y="536" width="18" height="18"/>
      <rect x="616" y="520" width="16" height="16"/><rect x="644" y="520" width="16" height="16"/>
      <rect x="616" y="556" width="16" height="16"/>
    </g>
    <rect x="644" y="556" width="16" height="16" fill="#fff6c8" filter="url(#lit)"/>
    <rect x="644" y="556" width="16" height="16" fill="#ffffff"/>
    <!-- doors -->
    <g fill="#2a0a52">
      <rect x="420" y="628" width="22" height="34"/><rect x="528" y="620" width="24" height="42"/><rect x="622" y="626" width="22" height="36"/>
    </g>
    <path d="M366 664 Q520 640 690 664" fill="none" stroke="#2a0a52" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
