name: format-once
on:
  push:
    branches: [agent/flutter-product-ci]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/flutter-product-ci
          path: cliptown-flutter
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: cliptown/cliptown-interfaces
          ref: main
          path: cliptown-interfaces
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve, format, and remove workflow
        working-directory: cliptown-flutter
        run: |
          flutter pub get
          dart format lib test integration_test
          rm .github/workflows/format-once.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply canonical Flutter formatting'
          git push origin HEAD:agent/flutter-product-ci
