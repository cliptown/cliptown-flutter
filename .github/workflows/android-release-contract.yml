name: Android release contract

on:
  pull_request:
    paths:
      - android/app/build.gradle.kts
      - scripts/check_android_release_contract.py
      - .github/workflows/android-release-contract.yml
      - .github/workflows/mobile-release.yml
      - docs/android-release-signing.md
  push:
    branches: [main]
    paths:
      - android/app/build.gradle.kts
      - scripts/check_android_release_contract.py
      - .github/workflows/android-release-contract.yml
      - .github/workflows/mobile-release.yml
      - docs/android-release-signing.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the fail-closed Android release contract
        run: python3 scripts/check_android_release_contract.py
      - name: Validate the Android release workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: >-
            .github/workflows/android-release-contract.yml
            .github/workflows/mobile-release.yml
