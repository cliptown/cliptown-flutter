name: Nix agent contract

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - .nix/**
      - pubspec.yaml
      - pubspec.lock
      - lib/**
      - test/**
      - integration_test/**
      - .github/workflows/test.yml
      - .github/workflows/nix.yml
  pull_request:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - .nix/**
      - pubspec.yaml
      - pubspec.lock
      - lib/**
      - test/**
      - integration_test/**
      - .github/workflows/test.yml
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Flutter repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Validate GitHub Actions with concise diagnostics
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/test.yml .github/workflows/nix.yml

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Flutter repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Reject whitespace errors and conflict markers
        run: |
          nix develop -c git diff --check
          if nix develop -c git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- .; then
            echo 'unresolved Git conflict marker found' >&2
            exit 1
          fi

      - name: Check Nix formatting
        run: nix develop -c nixfmt --check flake.nix .nix/dev-shell.nix

      - name: Lint the agent shell
        run: nix develop -c shellcheck .nix/agent-check.sh

      - name: Check the agent shell formatting
        run: nix develop -c shfmt -i 2 -ci -d .nix/agent-check.sh

      - name: Validate GitHub Actions
        run: nix develop -c actionlint .github/workflows/test.yml .github/workflows/nix.yml

      - name: Evaluate and build flake checks
        run: nix develop -c nix flake check --show-trace

      - name: Prove the bundled preflight entrypoint
        run: nix develop -c agent-check preflight

      - name: Resolve pinned sibling workspace
        run: nix develop -c agent-check workspace

      - name: Verify Flutter and Dart versions
        run: nix develop -c agent-check version

      - name: Resolve Dart packages
        run: nix develop -c agent-check pub

      - name: Check Dart formatting
        run: nix develop -c agent-check format

      - name: Analyze with warnings as errors
        run: nix develop -c agent-check analyze

      - name: Run unit and widget tests
        run: nix develop -c agent-check test

      - name: Prove default agent command
        run: nix develop -c agent-check
