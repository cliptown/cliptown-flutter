name: Nix agent contract

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - .nix/**
      - pubspec.yaml
      - pubspec.lock
      - lib/**
      - test/**
      - integration_test/**
      - .github/workflows/test.yml
      - .github/workflows/nix.yml
  pull_request:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - .nix/**
      - pubspec.yaml
      - pubspec.lock
      - lib/**
      - test/**
      - integration_test/**
      - .github/workflows/test.yml
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Flutter repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate Nix and agent contract
        run: nix develop -c agent-check preflight

      - name: Resolve pinned sibling workspace
        run: nix develop -c agent-check workspace

      - name: Verify Flutter and Dart versions
        run: nix develop -c agent-check version

      - name: Resolve Dart packages
        run: nix develop -c agent-check pub

      - name: Check Dart formatting
        run: nix develop -c agent-check format

      - name: Analyze with warnings as errors
        run: nix develop -c agent-check analyze

      - name: Run unit and widget tests
        run: nix develop -c agent-check test

      - name: Prove default agent command
        run: nix develop -c agent-check
