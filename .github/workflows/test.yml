name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLIPTOWN_INTERFACES_REF: e4e957b5372dc363fe6a52559c8959f0de781efb

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: cliptown-flutter
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: cliptown/cliptown-interfaces
          ref: ${{ env.CLIPTOWN_INTERFACES_REF }}
          path: cliptown-interfaces
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Resolve dependencies
        working-directory: cliptown-flutter
        run: flutter pub get
      - name: Verify dependency lockfile is current
        shell: bash
        working-directory: cliptown-flutter
        run: git diff --exit-code -- pubspec.lock
      - name: Verify formatting
        working-directory: cliptown-flutter
        run: |
          dart format lib test integration_test
          git diff --exit-code -- lib test integration_test
      - name: Analyze with warnings as errors
        id: analyze
        continue-on-error: true
        working-directory: cliptown-flutter
        run: flutter analyze --fatal-infos --fatal-warnings > analyze.txt 2>&1
      - name: Upload analyzer diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-analyzer
          path: cliptown-flutter/analyze.txt
          if-no-files-found: error
      - name: Enforce analyzer result
        if: steps.analyze.outcome == 'failure'
        working-directory: cliptown-flutter
        run: cat analyze.txt && exit 1
      - name: Run unit and widget tests with coverage
        working-directory: cliptown-flutter
        run: flutter test --coverage --reporter=expanded
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-coverage
          path: cliptown-flutter/coverage/lcov.info
          if-no-files-found: error

  desktop-builds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact_path: build/linux/x64/debug/bundle
          - os: macos-latest
            target: macos
            artifact_path: build/macos/Build/Products/Debug/cliptown_app.app
          - os: windows-latest
            target: windows
            artifact_path: build/windows/x64/runner/Debug
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: cliptown-flutter
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: cliptown/cliptown-interfaces
          ref: ${{ env.CLIPTOWN_INTERFACES_REF }}
          path: cliptown-interfaces
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            xvfb \
            libgtk-3-dev \
            libsecret-1-dev \
            libkeybinder-3.0-dev \
            libayatana-appindicator3-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Build ${{ matrix.target }} debug application
        shell: bash
        working-directory: cliptown-flutter
        run: |
          flutter config --enable-${{ matrix.target }}-desktop
          flutter pub get
          flutter build ${{ matrix.target }} --debug
      - name: Run installed ${{ matrix.target }} desktop journeys
        id: desktop_test
        continue-on-error: true
        shell: bash
        working-directory: cliptown-flutter
        run: |
          set -euo pipefail
          run_desktop_test() {
            local test_file="$1"
            if [[ "${{ runner.os }}" == "Linux" ]]; then
              xvfb-run -a flutter test "$test_file" \
                -d "${{ matrix.target }}" --reporter=expanded
            else
              flutter test "$test_file" \
                -d "${{ matrix.target }}" --reporter=expanded
            fi
          }

          {
            run_desktop_test integration_test/app_test.dart
            run_desktop_test integration_test/desktop_clipboard_e2e_test.dart
            run_desktop_test integration_test/desktop_lifecycle_test.dart
          } 2>&1 | tee desktop-integration.txt
      - name: Capture desktop crash diagnostics
        if: always()
        shell: bash
        working-directory: cliptown-flutter
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            log show --style compact --last 30m \
              --predicate 'process == "cliptown_app"' \
              > desktop-system.log 2>&1 || true
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            coredumpctl --no-pager --since '-30 min' \
              > desktop-system.log 2>&1 || true
          else
            powershell.exe -NoProfile -Command \
              "Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-30)} | Where-Object { \$_.Message -match 'cliptown_app' } | Format-List -Property '*'" \
              > desktop-system.log 2>&1 || true
          fi
      - name: Upload ${{ matrix.target }} debug application and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-${{ matrix.target }}-debug-and-e2e
          path: |
            cliptown-flutter/${{ matrix.artifact_path }}
            cliptown-flutter/desktop-integration.txt
            cliptown-flutter/desktop-system.log
          if-no-files-found: warn
      - name: Enforce ${{ matrix.target }} desktop journeys
        if: steps.desktop_test.outcome == 'failure'
        shell: bash
        working-directory: cliptown-flutter
        run: cat desktop-integration.txt 2>/dev/null || true; exit 1

  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: cliptown-flutter
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: cliptown/cliptown-interfaces
          ref: ${{ env.CLIPTOWN_INTERFACES_REF }}
          path: cliptown-interfaces
      - name: Configure Android virtual device home
        shell: bash
        run: echo "ANDROID_AVD_HOME=$RUNNER_TEMP/cliptown-android-avd" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM group permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ -e /dev/kvm ]]; then
            ls -l /dev/kvm
          else
            echo '/dev/kvm is unavailable; emulator will fall back to software acceleration.'
          fi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Resolve dependencies and build Android application
        working-directory: cliptown-flutter
        run: flutter pub get && flutter build apk --debug
      - name: Install and create Android virtual device
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "emulator" \
            "platforms;android-29" \
            "system-images;android-29;default;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name cliptown-ci-api-29 \
            --package "system-images;android-29;default;x86_64" \
            --device "pixel_6"
          test -f "$ANDROID_AVD_HOME/cliptown-ci-api-29.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
      - name: Boot Android emulator and run integration tests
        id: android_test
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export ADB="$ANDROID_HOME/platform-tools/adb"
          "$ANDROID_HOME/emulator/emulator" \
            -avd cliptown-ci-api-29 \
            -port 5554 \
            -no-window \
            -gpu swiftshader_indirect \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            > cliptown-flutter/android-emulator.log 2>&1 &
          echo "$!" > cliptown-flutter/android-emulator.pid
          "$ADB" start-server
          deadline=$((SECONDS + 900))
          until "$ADB" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null \
            | tr -d "\r" \
            | grep -q '^1$'; do
            if ((SECONDS >= deadline)); then
              echo 'Android emulator did not finish booting within 900 seconds.' >&2
              exit 124
            fi
            sleep 5
          done
          "$ADB" -s emulator-5554 wait-for-device
          "$ADB" -s emulator-5554 shell settings put global window_animation_scale 0
          "$ADB" -s emulator-5554 shell settings put global transition_animation_scale 0
          "$ADB" -s emulator-5554 shell settings put global animator_duration_scale 0
          cd cliptown-flutter
          flutter devices --machine | tee android-devices.json

          run_android_test() {
            local test_file="$1"
            local attempt exit_code
            for attempt in 1 2; do
              echo "Running $test_file on Android emulator (attempt $attempt of 2)."
              if python3 tool/run_with_timeout.py \
                --timeout-seconds 420 \
                --label "Android integration test $test_file" \
                -- flutter test "$test_file" \
                  -d emulator-5554 --reporter=expanded; then
                return 0
              else
                exit_code=$?
              fi

              if [[ "$exit_code" -ne 124 || "$attempt" -eq 2 ]]; then
                return "$exit_code"
              fi

              echo "The Flutter launch stalled; resetting the app before one retry."
              "$ADB" -s emulator-5554 shell am force-stop com.cliptown.cliptown_app || true
              "$ADB" -s emulator-5554 shell pm clear com.cliptown.cliptown_app || true
              "$ADB" -s emulator-5554 wait-for-device
            done
          }

          {
            run_android_test integration_test/app_test.dart
            run_android_test integration_test/security_center_smoke_test.dart
          } 2>&1 | tee android-integration.txt
      - name: Capture Android diagnostics
        if: always()
        shell: bash
        run: |
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 logcat -d > cliptown-flutter/adb-logcat.txt 2>&1 || true
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell getprop > cliptown-flutter/android-properties.txt 2>&1 || true
          pgrep -af emulator > cliptown-flutter/android-emulator-process.txt 2>&1 || true
          find "$ANDROID_AVD_HOME" -maxdepth 2 -type f -print > cliptown-flutter/android-avd-files.txt 2>&1 || true
      - name: Upload Android emulator diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-emulator-diagnostics
          path: |
            cliptown-flutter/android-emulator.log
            cliptown-flutter/android-devices.json
            cliptown-flutter/android-integration.txt
            cliptown-flutter/adb-logcat.txt
            cliptown-flutter/android-properties.txt
            cliptown-flutter/android-emulator-process.txt
            cliptown-flutter/android-avd-files.txt
          if-no-files-found: warn
      - name: Enforce Android integration result
        if: steps.android_test.outcome == 'failure'
        working-directory: cliptown-flutter
        run: |
          cat android-integration.txt 2>/dev/null || true
          tail -n 200 android-emulator.log 2>/dev/null || true
          exit 1

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: cliptown-flutter
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: cliptown/cliptown-interfaces
          ref: ${{ env.CLIPTOWN_INTERFACES_REF }}
          path: cliptown-interfaces
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Build iOS simulator application
        working-directory: cliptown-flutter
        run: flutter pub get && flutter build ios --simulator
      - name: Boot an available iPhone simulator and run integration tests
        id: ios_test
        continue-on-error: true
        shell: bash
        working-directory: cliptown-flutter
        run: |
          set -euo pipefail
          xcrun simctl list devices available | tee simctl-devices.txt
          DEVICE_ID=$(python3 - <<'PY'
          import re
          text = open('simctl-devices.txt', encoding='utf-8').read()
          match = re.search(r'iPhone[^\n]*\(([0-9A-Fa-f-]{36})\) \((?:Booted|Shutdown)\)', text)
          if not match:
              raise SystemExit('no available iPhone simulator found')
          print(match.group(1))
          PY
          )
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          flutter devices --machine | tee flutter-devices.json

          run_ios_test() {
            local test_file="$1"
            local attempt exit_code
            for attempt in 1 2; do
              echo "Running $test_file on iOS simulator (attempt $attempt of 2)."
              if python3 tool/run_with_timeout.py \
                --timeout-seconds 420 \
                --label "iOS integration test $test_file" \
                -- flutter test "$test_file" \
                  -d "$DEVICE_ID" --reporter=expanded; then
                return 0
              else
                exit_code=$?
              fi

              if [[ "$exit_code" -ne 124 || "$attempt" -eq 2 ]]; then
                return "$exit_code"
              fi

              echo "The Flutter launch stalled; rebooting the simulator before one retry."
              xcrun simctl shutdown "$DEVICE_ID" || true
              xcrun simctl boot "$DEVICE_ID"
              xcrun simctl bootstatus "$DEVICE_ID" -b
            done
          }

          {
            run_ios_test integration_test/app_test.dart
            run_ios_test integration_test/security_center_smoke_test.dart
          } 2>&1 | tee ios-integration.txt
      - name: Capture iOS simulator diagnostics
        if: always()
        shell: bash
        working-directory: cliptown-flutter
        run: |
          if [[ ! -s flutter-devices.json ]]; then
            echo 'flutter-devices.json is unavailable; skipping Runner log capture.'
            exit 0
          fi
          DEVICE_ID=$(python3 - <<'PY'
          import json
          from pathlib import Path
          devices = json.loads(Path('flutter-devices.json').read_text(encoding='utf-8'))
          print(next((device['id'] for device in devices if device['targetPlatform'] == 'ios'), ''))
          PY
          )
          if [[ -z "$DEVICE_ID" ]]; then
            echo 'No iOS simulator was recorded; skipping Runner log capture.'
            exit 0
          fi
          xcrun simctl spawn "$DEVICE_ID" log show \
            --style compact \
            --last 20m \
            --predicate 'process == "Runner"' \
            > ios-simulator-system.log 2>&1 || true
      - name: Upload iOS simulator diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator-diagnostics
          path: |
            cliptown-flutter/simctl-devices.txt
            cliptown-flutter/flutter-devices.json
            cliptown-flutter/ios-integration.txt
            cliptown-flutter/ios-simulator-system.log
          if-no-files-found: warn
      - name: Enforce iOS integration result
        if: steps.ios_test.outcome == 'failure'
        working-directory: cliptown-flutter
        run: cat ios-integration.txt 2>/dev/null || true; exit 1
