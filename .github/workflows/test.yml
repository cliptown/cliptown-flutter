name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLIPTOWN_INTERFACES_REF: e4e957b5372dc363fe6a52559c8959f0de781efb

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: cliptown-flutter
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cliptown/cliptown-interfaces
          ref: ${{ env.CLIPTOWN_INTERFACES_REF }}
          path: cliptown-interfaces
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: cliptown-flutter
        run: flutter pub get
      - name: Verify dependency lockfile is current
        shell: bash
        working-directory: cliptown-flutter
        run: git diff --exit-code -- pubspec.lock
      - name: Verify formatting
        working-directory: cliptown-flutter
        run: |
          dart format lib test integration_test
          git diff --exit-code -- lib test integration_test
      - name: Analyze with warnings as errors
        id: analyze
        continue-on-error: true
        working-directory: cliptown-flutter
        run: flutter analyze --fatal-infos --fatal-warnings > analyze.txt 2>&1
      - name: Upload analyzer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyzer
          path: cliptown-flutter/analyze.txt
          if-no-files-found: error
      - name: Enforce analyzer result
        if: steps.analyze.outcome == 'failure'
        working-directory: cliptown-flutter
        run: cat analyze.txt && exit 1
      - name: Run unit and widget tests with coverage
        working-directory: cliptown-flutter
        run: flutter test --coverage --reporter=expanded
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: cliptown-flutter/coverage/lcov.info
          if-no-files-found: error

  desktop-builds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: cliptown-flutter
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cliptown/cliptown-interfaces
          ref: ${{ env.CLIPTOWN_INTERFACES_REF }}
          path: cliptown-interfaces
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Build ${{ matrix.target }} debug application
        shell: bash
        working-directory: cliptown-flutter
        run: |
          flutter config --enable-${{ matrix.target }}-desktop
          flutter pub get
          flutter build ${{ matrix.target }} --debug

  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: cliptown-flutter
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cliptown/cliptown-interfaces
          ref: ${{ env.CLIPTOWN_INTERFACES_REF }}
          path: cliptown-interfaces
      - name: Configure Android virtual device home
        shell: bash
        run: echo "ANDROID_AVD_HOME=$RUNNER_TEMP/cliptown-android-avd" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM group permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ -e /dev/kvm ]]; then
            ls -l /dev/kvm
          else
            echo '/dev/kvm is unavailable; emulator will fall back to software acceleration.'
          fi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies and build Android application
        working-directory: cliptown-flutter
        run: flutter pub get && flutter build apk --debug
      - name: Install and create Android virtual device
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "emulator" \
            "platforms;android-29" \
            "system-images;android-29;default;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name cliptown-ci-api-29 \
            --package "system-images;android-29;default;x86_64" \
            --device "pixel_6"
          test -f "$ANDROID_AVD_HOME/cliptown-ci-api-29.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
      - name: Boot Android emulator and run integration tests
        id: android_test
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export ADB="$ANDROID_HOME/platform-tools/adb"
          "$ANDROID_HOME/emulator/emulator" \
            -avd cliptown-ci-api-29 \
            -port 5554 \
            -no-window \
            -gpu swiftshader_indirect \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            > cliptown-flutter/android-emulator.log 2>&1 &
          echo "$!" > cliptown-flutter/android-emulator.pid
          "$ADB" start-server
          deadline=$((SECONDS + 900))
          until "$ADB" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null \
            | tr -d "\r" \
            | grep -q '^1$'; do
            if ((SECONDS >= deadline)); then
              echo 'Android emulator did not finish booting within 900 seconds.' >&2
              exit 124
            fi
            sleep 5
          done
          "$ADB" -s emulator-5554 wait-for-device
          "$ADB" -s emulator-5554 shell settings put global window_animation_scale 0
          "$ADB" -s emulator-5554 shell settings put global transition_animation_scale 0
          "$ADB" -s emulator-5554 shell settings put global animator_duration_scale 0
          cd cliptown-flutter
          flutter devices --machine | tee android-devices.json
          {
            flutter test integration_test -d emulator-5554 --reporter=expanded
          } 2>&1 | tee android-integration.txt
      - name: Capture Android diagnostics
        if: always()
        shell: bash
        run: |
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 logcat -d > cliptown-flutter/adb-logcat.txt 2>&1 || true
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell getprop > cliptown-flutter/android-properties.txt 2>&1 || true
          pgrep -af emulator > cliptown-flutter/android-emulator-process.txt 2>&1 || true
          find "$ANDROID_AVD_HOME" -maxdepth 2 -type f -print > cliptown-flutter/android-avd-files.txt 2>&1 || true
      - name: Upload Android emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: |
            cliptown-flutter/android-emulator.log
            cliptown-flutter/android-devices.json
            cliptown-flutter/android-integration.txt
            cliptown-flutter/adb-logcat.txt
            cliptown-flutter/android-properties.txt
            cliptown-flutter/android-emulator-process.txt
            cliptown-flutter/android-avd-files.txt
          if-no-files-found: warn
      - name: Enforce Android integration result
        if: steps.android_test.outcome == 'failure'
        working-directory: cliptown-flutter
        run: |
          cat android-integration.txt 2>/dev/null || true
          tail -n 200 android-emulator.log 2>/dev/null || true
          exit 1

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: cliptown-flutter
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cliptown/cliptown-interfaces
          ref: ${{ env.CLIPTOWN_INTERFACES_REF }}
          path: cliptown-interfaces
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Build iOS simulator application
        working-directory: cliptown-flutter
        run: flutter pub get && flutter build ios --simulator
      - name: Boot an available iPhone simulator and run integration tests
        id: ios_test
        continue-on-error: true
        shell: bash
        working-directory: cliptown-flutter
        run: |
          xcrun simctl list devices available | tee simctl-devices.txt
          DEVICE_ID=$(python3 - <<'PY'
          import re
          text = open('simctl-devices.txt', encoding='utf-8').read()
          match = re.search(r'iPhone[^\n]*\(([0-9A-Fa-f-]{36})\) \((?:Booted|Shutdown)\)', text)
          if not match:
              raise SystemExit('no available iPhone simulator found')
          print(match.group(1))
          PY
          )
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          flutter devices --machine | tee flutter-devices.json
          {
            flutter test integration_test/app_test.dart -d "$DEVICE_ID" --reporter=expanded
            flutter test integration_test/security_center_smoke_test.dart -d "$DEVICE_ID" --reporter=expanded
          } 2>&1 | tee ios-integration.txt
      - name: Upload iOS simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-diagnostics
          path: |
            cliptown-flutter/simctl-devices.txt
            cliptown-flutter/flutter-devices.json
            cliptown-flutter/ios-integration.txt
          if-no-files-found: warn
      - name: Enforce iOS integration result
        if: steps.ios_test.outcome == 'failure'
        working-directory: cliptown-flutter
        run: cat ios-integration.txt 2>/dev/null || true; exit 1
