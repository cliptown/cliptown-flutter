name: format-platform-capabilities-once

on:
  push:
    branches: [agent/den-48-platform-capability-contract]
    paths:
      - test/platform_capabilities_test.dart
      - .github/workflows/format-platform-capabilities-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/den-48-platform-capability-contract
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format test and remove maintenance workflow
        run: |
          dart format test/platform_capabilities_test.dart
          rm .github/workflows/format-platform-capabilities-once.yml
      - name: Commit canonical formatting
        run: |
          git add test/platform_capabilities_test.dart .github/workflows/format-platform-capabilities-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format DEN-48 platform contract test'
          git push origin HEAD:agent/den-48-platform-capability-contract
