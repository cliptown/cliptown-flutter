name: Security format preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cliptown-flutter
      - uses: actions/checkout@v4
        with:
          repository: cliptown/cliptown-interfaces
          ref: e4e957b5372dc363fe6a52559c8959f0de781efb
          path: cliptown-interfaces
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format security sources
        working-directory: cliptown-flutter
        run: dart format lib/security.dart lib/security test/security_center_test.dart test/security_contract_test.dart integration_test/security_center_smoke_test.dart
      - name: Archive formatted sources
        working-directory: cliptown-flutter
        run: zip -r security-formatted.zip lib/security.dart lib/security test/security_center_test.dart test/security_contract_test.dart integration_test/security_center_smoke_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: security-formatted
          path: cliptown-flutter/security-formatted.zip
          if-no-files-found: error
