name: Temporary Dart formatter

on:
  push:
    branches:
      - alexander-mills/den-3913-cliptown-first-frame

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4

      - name: Install stable Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Format Dart sources and tests
        run: dart format lib test

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- lib test; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: apply stable Dart formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
